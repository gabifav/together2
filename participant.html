<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Together2 Journey</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
<div class="container">

  <header class="hero">
    <h1>🌳 My Together2 Journey</h1>
    <p>A growing skill tree of achievements, progress and confidence.</p>
  </header>

  <section class="panel">
    <h2>Find Participant</h2>
    <input id="searchParticipant" placeholder="Type participant name..." />
    <div id="participants" class="grid"></div>
  </section>

  <section id="profilePanel" class="panel hidden">
    <h2 id="profileName"></h2>
    <p id="profileStats"></p>

    <div class="progress-bg">
      <div id="progressBar"></div>
    </div>

    <h3>🌳 Skill Tree</h3>
    <div id="treeView" class="tree"></div>
  </section>

</div>

<script type="module" src="participant.js"></script>
</body>
</html>
